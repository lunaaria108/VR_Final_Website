<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A VR final project by Olive Obianagha and Luna Kilpatrick.">
  <meta name="theme-color" content="#10111b">
  <title>VR Final Project</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      color: #f2f0fa;
      background: #10111b;
      --muted: #bbb8ce;
      --accent: #cbbaff;
      --line: #353346;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(100% - 3rem, 56rem);
      margin-inline: auto;
      padding-block: clamp(3.5rem, 11vw, 8rem) 4rem;
    }

    header {
      padding-bottom: clamp(2.5rem, 6vw, 4rem);
      border-bottom: 1px solid var(--line);
    }

    h1, h2, p { margin: 0; }

    h1 {
      max-width: 12ch;
      font-size: clamp(3rem, 9vw, 6rem);
      letter-spacing: -.065em;
      line-height: 1;
    }

    section { margin-top: 2.5rem; }

    h2 {
      margin-bottom: .9rem;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .description {
      min-height: 9rem;
      padding: 1.25rem;
      border: 1px dashed #59556e;
      border-radius: .75rem;
      color: var(--muted);
      line-height: 1.65;
      background: #171824;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem 2rem;
      padding: 0;
      margin: 0;
      list-style: none;
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>VR Final Project</h1>
    </header>

    <section aria-labelledby="description-heading">
      <h2 id="description-heading">Project Description</h2>
      <p class="description">Add your project description here.</p>
    </section>

    <section aria-labelledby="contributors-heading">
      <h2 id="contributors-heading">Contributors</h2>
      <ul role="list">
        <li>Olive Obianagha</li>
        <li>Luna Kilpatrick</li>
      </ul>
    </section>
  </main>
</body>
</html>
